<html lang="en">
  <head>

    <meta name="theme-color" content="#15362F" />
    <title>Adda Khana</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%2315362F'/><text x='32' y='46' font-size='40' text-anchor='middle' fill='%23F2C230' font-family='serif'>আ</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla:ital@0;1&display=swap"
    />
    <script>
      try {
        var t = localStorage.getItem('adda-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
